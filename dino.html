<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1B1035">
    <title>Dino Dash | Sky Jumper</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        :root {
            color-scheme: dark;
            --bg: #1b1035;
            --panel: #2a1b54;
            --panel-soft: #362268;
            --accent: #ffd23f;
            --text: #f5f3ff;
            --muted: #c9c2e8;
            --font-display: 'Fredoka', sans-serif;
            --font-body: 'Nunito', sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 28px 20px;
            display: grid;
            place-items: center;
            color: var(--text);
            background: radial-gradient(ellipse at 50% 0%, rgba(93, 67, 159, .3), transparent 55%), var(--bg);
            font-family: var(--font-body);
        }

        button {
            font: inherit;
        }

        .shell {
            width: min(100%, 980px);
            animation: arrive .55s ease-out both;
        }

        .masthead {
            display: flex;
            align-items: end;
            justify-content: space-between;
            gap: 20px;
            margin: 0 2px 16px;
        }

        .eyebrow {
            margin: 0 0 3px;
            color: var(--muted);
            font-size: .75rem;
            font-weight: 800;
            letter-spacing: 1.6px;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            color: var(--accent);
            font: 600 clamp(2rem, 5vw, 2.8rem)/1 var(--font-display);
        }

        .best-score {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 9px 13px;
            border: 1px solid rgba(201, 194, 232, .18);
            border-radius: 12px;
            background: rgba(42, 27, 84, .75);
            color: var(--muted);
            font-size: .82rem;
            font-weight: 800;
            white-space: nowrap;
        }

        .best-score strong {
            color: var(--accent);
            font: 600 1.05rem var(--font-display);
        }

        .game-panel {
            overflow: hidden;
            border: 2px solid var(--panel-soft);
            border-radius: 18px;
            background: var(--panel);
            box-shadow: 0 22px 70px rgba(0, 0, 0, .28);
        }

        .score-row {
            min-height: 50px;
            padding: 0 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: var(--muted);
            font-size: .84rem;
            font-weight: 800;
        }

        .score-live {
            color: var(--accent);
            font: 600 1.15rem var(--font-display);
        }

        .stage {
            position: relative;
            height: clamp(270px, 42vw, 390px);
            min-height: 250px;
            overflow: hidden;
            background: #251858;
            isolation: isolate;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .overlay {
            position: absolute;
            inset: 0;
            z-index: 2;
            display: grid;
            place-items: center;
            padding: 20px;
            background: rgba(20, 12, 43, .52);
            backdrop-filter: blur(3px);
            text-align: center;
        }

        .overlay[hidden] {
            display: none;
        }

        .dialog {
            width: min(100%, 370px);
            padding: 25px 24px 23px;
            border: 1px solid rgba(255, 210, 63, .25);
            border-radius: 16px;
            background: rgba(42, 27, 84, .96);
            box-shadow: 0 18px 48px rgba(0, 0, 0, .3);
            animation: pop-in .28s ease-out both;
        }

        .dialog-mark {
            margin-bottom: 5px;
            font-size: 2rem;
        }

        .dialog h2 {
            margin: 0;
            color: var(--accent);
            font: 600 1.85rem/1.1 var(--font-display);
        }

        .dialog p {
            margin: 9px 0 18px;
            color: var(--muted);
            line-height: 1.55;
        }

        .primary-button {
            width: 100%;
            min-height: 48px;
            border: 0;
            border-radius: 11px;
            background: var(--accent);
            box-shadow: 0 4px 0 #c9971f;
            color: var(--bg);
            cursor: pointer;
            font: 600 1.08rem var(--font-display);
            transition: transform .12s, box-shadow .12s, filter .12s;
        }

        .primary-button:hover {
            filter: brightness(1.06);
        }

        .primary-button:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #c9971f;
        }

        button:focus-visible {
            outline: 3px solid white;
            outline-offset: 3px;
        }

        .underbar {
            min-height: 62px;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            border-top: 1px solid rgba(201, 194, 232, .12);
        }

        .hint {
            margin: 0;
            color: var(--muted);
            font-size: .84rem;
        }

        .hint kbd {
            display: inline-block;
            min-width: 25px;
            margin: 0 2px;
            padding: 2px 6px;
            border: 1px solid rgba(201, 194, 232, .22);
            border-radius: 5px;
            background: rgba(54, 34, 104, .8);
            color: var(--text);
            font: 800 .75rem var(--font-body);
            text-align: center;
        }

        .mobile-controls {
            display: none;
            gap: 8px;
        }

        .control-button {
            width: 48px;
            height: 42px;
            border: 1px solid rgba(201, 194, 232, .2);
            border-radius: 9px;
            background: var(--panel-soft);
            color: var(--text);
            cursor: pointer;
            font: 600 .72rem var(--font-display);
            touch-action: none;
        }

        .control-button.jump {
            color: var(--accent);
        }

        footer {
            margin-top: 13px;
            color: #9188b2;
            font-size: .78rem;
            text-align: center;
        }

        @keyframes arrive {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pop-in {
            from {
                opacity: 0;
                transform: translateY(7px) scale(.98);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @media (max-width: 600px) {
            body {
                padding: 18px 12px;
                align-items: start;
            }

            .masthead {
                align-items: center;
                margin-bottom: 12px;
            }

            .best-score {
                padding: 8px 10px;
                font-size: .72rem;
            }

            .stage {
                height: min(62vh, 360px);
                min-height: 260px;
            }

            .underbar {
                align-items: center;
            }

            .hint {
                max-width: 56%;
                font-size: .75rem;
                line-height: 1.55;
            }

            .mobile-controls {
                display: flex;
            }
        }

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation-duration: .01ms !important;
                animation-iteration-count: 1 !important;
                scroll-behavior: auto !important;
            }
        }
    </style>
</head>

<body>
    <main class="shell">
        <header class="masthead">
            <div>
                <p class="eyebrow">Sky Jumper presents</p>
                <h1>Dino Dash</h1>
            </div>
            <div class="best-score" aria-label="Skor terbaik">BEST <strong id="bestScore">00000</strong></div>
        </header>

        <section class="game-panel" aria-label="Permainan Dino Dash">
            <div class="score-row">
                <span id="gameStatus" aria-live="polite">SIAP BERLARI?</span>
                <span class="score-live" id="score">00000</span>
            </div>
            <div class="stage" id="stage">
                <canvas id="gameCanvas" aria-label="Dinosaurus berlari dan menghindari rintangan"></canvas>
                <div class="overlay" id="overlay">
                    <div class="dialog">
                        <div class="dialog-mark" id="dialogMark">🦖</div>
                        <h2 id="dialogTitle">Dino Dash</h2>
                        <p id="dialogText">Lompati kaktus, hindari burung, dan bertahan selama mungkin.</p>
                        <button class="primary-button" id="startButton" type="button">Mulai Berlari</button>
                    </div>
                </div>
            </div>
            <div class="underbar">
                <p class="hint"><kbd>SPACE</kbd> / <kbd>↑</kbd> lompat <span aria-hidden="true">·</span> <kbd>↓</kbd>
                    menunduk</p>
                <div class="mobile-controls" aria-label="Kontrol sentuh">
                    <button class="control-button jump" id="jumpButton" type="button"
                        aria-label="Lompat">LOMPAT</button>
                    <button class="control-button" id="duckButton" type="button" aria-label="Menunduk">TUNDUK</button>
                </div>
            </div>
        </section>
        <footer>Rekor tersimpan otomatis di perangkat ini</footer>
    </main>

    <script>
        (() => {
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            const stage = document.getElementById('stage');
            const overlay = document.getElementById('overlay');
            const startButton = document.getElementById('startButton');
            const scoreLabel = document.getElementById('score');
            const bestLabel = document.getElementById('bestScore');
            const statusLabel = document.getElementById('gameStatus');
            const dialogMark = document.getElementById('dialogMark');
            const dialogTitle = document.getElementById('dialogTitle');
            const dialogText = document.getElementById('dialogText');
            const palette = {
                skyTop: '#251858', skyBottom: '#171139', ridgeFar: '#342568',
                ridgeNear: '#49329c', ground: '#8a76f7', groundDark: '#24184c',
                gold: '#ffd23f', cream: '#fff2b0', green: '#4ade80', ink: '#211547'
            };

            let width = 0;
            let height = 0;
            let groundY = 0;
            let state = 'ready';
            let lastTime = 0;
            let elapsed = 0;
            let score = 0;
            let speed = 330;
            let spawnTimer = 0;
            let obstacles = [];
            let particles = [];
            let jumpHeld = false;
            let duckHeld = false;
            let best = Number(localStorage.getItem('dinoDashBest') || 0);
            let animationId = 0;
            const player = { x: 82, y: 0, vy: 0, width: 46, height: 54, duckHeight: 34, onGround: true, runTime: 0 };
            const stars = Array.from({ length: 48 }, (_, index) => ({
                x: (index * 197 + 31) % 1200,
                y: 18 + ((index * 67) % 150),
                radius: index % 5 === 0 ? 1.8 : 1,
                phase: index * .8
            }));

            function formatScore(value) {
                return String(Math.floor(value)).padStart(5, '0');
            }

            bestLabel.textContent = formatScore(best);

            function resizeCanvas() {
                const bounds = stage.getBoundingClientRect();
                const ratio = Math.min(window.devicePixelRatio || 1, 2);
                width = bounds.width;
                height = bounds.height;
                canvas.width = Math.round(width * ratio);
                canvas.height = Math.round(height * ratio);
                ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
                groundY = height - 46;
                player.x = Math.min(82, width * .13);
                if (player.onGround) player.y = groundY - player.height;
                draw();
            }

            function roundedRect(x, y, w, h, radius, color) {
                ctx.fillStyle = color;
                ctx.beginPath();
                ctx.roundRect(x, y, w, h, radius);
                ctx.fill();
            }

            function drawRidge(baseY, amplitude, color, offset) {
                const step = Math.max(70, width / 9);
                ctx.fillStyle = color;
                ctx.beginPath();
                ctx.moveTo(0, baseY);
                for (let i = -1; i < width / step + 2; i++) {
                    const x = i * step - (offset % step);
                    const peakY = baseY - amplitude * (.45 + .55 * Math.sin(i * 12.39 + 2));
                    ctx.lineTo(x + step * .5, peakY);
                    ctx.lineTo(x + step, baseY);
                }
                ctx.lineTo(width, groundY);
                ctx.lineTo(0, groundY);
                ctx.closePath();
                ctx.fill();
            }

            function drawBackdrop() {
                const gradient = ctx.createLinearGradient(0, 0, 0, height);
                gradient.addColorStop(0, palette.skyTop);
                gradient.addColorStop(1, palette.skyBottom);
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, width, height);

                const glow = ctx.createRadialGradient(width * .78, height * .25, 4, width * .78, height * .25, height * .44);
                glow.addColorStop(0, 'rgba(255, 210, 63, .15)');
                glow.addColorStop(1, 'rgba(255, 210, 63, 0)');
                ctx.fillStyle = glow;
                ctx.fillRect(0, 0, width, height);

                stars.forEach((star) => {
                    ctx.globalAlpha = .35 + (Math.sin(elapsed * 1.5 + star.phase) + 1) * .2;
                    ctx.fillStyle = palette.cream;
                    ctx.beginPath();
                    ctx.arc(star.x % width, star.y, star.radius, 0, Math.PI * 2);
                    ctx.fill();
                });
                ctx.globalAlpha = 1;

                const drift = (elapsed * speed * .09) % (width + 200);
                drawRidge(groundY - 65, 36, palette.ridgeFar, drift * .55);
                drawRidge(groundY - 28, 22, palette.ridgeNear, drift);
                ctx.fillStyle = palette.groundDark;
                ctx.fillRect(0, groundY, width, height - groundY);
                ctx.fillStyle = palette.ground;
                ctx.fillRect(0, groundY, width, 4);
                ctx.fillStyle = 'rgba(255, 210, 63, .45)';
                for (let x = -((elapsed * speed * .75) % 55); x < width; x += 55) {
                    ctx.fillRect(x, groundY + 18, 19, 3);
                    ctx.fillRect(x + 25, groundY + 31, 8, 2);
                }
            }

            function drawDino() {
                const ducking = duckHeld && player.onGround && state === 'running';
                const h = ducking ? player.duckHeight : player.height;
                const x = player.x;
                const y = player.y + (player.height - h);
                const legSwing = player.onGround && !ducking ? Math.sin(player.runTime * 15) : 0;

                ctx.fillStyle = 'rgba(8, 5, 23, .3)';
                ctx.beginPath();
                ctx.ellipse(x + 27, groundY + 4, ducking ? 32 : 24, 5, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = palette.gold;
                ctx.beginPath();
                ctx.moveTo(x + 10, y + h * .62);
                ctx.lineTo(x - 9, y + h * .48);
                ctx.lineTo(x + 4, y + h * .78);
                ctx.lineTo(x + 17, y + h * .75);
                ctx.fill();
                roundedRect(x + 11, y + h * .35, ducking ? 35 : 29, h * .49, 8, palette.gold);
                roundedRect(x + 22, y + h * .08, 26, h * .36, 8, palette.gold);
                roundedRect(x + 37, y + h * .17, 18, 12, 4, palette.gold);
                ctx.fillStyle = palette.cream;
                ctx.fillRect(x + 42, y + h * .19, 10, 4);
                ctx.fillStyle = palette.ink;
                ctx.beginPath();
                ctx.arc(x + 40, y + h * .14, 2.1, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#f28c5b';
                ctx.fillRect(x + 26, y + h * .48, 9, 8);
                ctx.fillRect(x + 36, y + h * .48, 6, 8);

                if (!ducking) {
                    ctx.save();
                    ctx.translate(x + 20, y + h * .79);
                    ctx.rotate(legSwing * .42);
                    roundedRect(-4, 0, 9, 16, 3, palette.gold);
                    ctx.restore();
                    ctx.save();
                    ctx.translate(x + 34, y + h * .79);
                    ctx.rotate(-legSwing * .42);
                    roundedRect(-3, 0, 9, 16, 3, palette.gold);
                    ctx.restore();
                    ctx.fillStyle = palette.cream;
                    ctx.fillRect(x + 14 + Math.max(0, legSwing) * 4, y + h - 2, 14, 4);
                    ctx.fillRect(x + 30 + Math.max(0, -legSwing) * 4, y + h - 2, 14, 4);
                } else {
                    roundedRect(x + 19, y + h - 8, 15, 7, 3, palette.gold);
                    roundedRect(x + 36, y + h - 8, 15, 7, 3, palette.gold);
                }
                ctx.fillStyle = palette.cream;
                ctx.fillRect(x + 18, y + h * .56, 4, 4);
                ctx.fillRect(x + 27, y + h * .56, 4, 4);
            }

            function drawCactus(obstacle) {
                const x = obstacle.x;
                const y = groundY - obstacle.height;
                roundedRect(x + 10, y, 15, obstacle.height, 5, palette.green);
                roundedRect(x, y + obstacle.height * .42, 11, obstacle.height * .32, 4, palette.green);
                roundedRect(x, y + obstacle.height * .27, 8, obstacle.height * .22, 4, palette.green);
                roundedRect(x + 24, y + obstacle.height * .54, 10, obstacle.height * .28, 4, palette.green);
                roundedRect(x + 28, y + obstacle.height * .39, 7, obstacle.height * .22, 4, palette.green);
                ctx.fillStyle = 'rgba(33, 21, 71, .35)';
                ctx.fillRect(x + 14, y + 6, 3, obstacle.height - 12);
            }

            function drawBird(obstacle) {
                const flap = Math.sin(elapsed * 12) * 6;
                const x = obstacle.x;
                const y = obstacle.y;
                ctx.fillStyle = '#ff927b';
                ctx.beginPath();
                ctx.ellipse(x + 21, y + 13, 19, 11, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.moveTo(x + 20, y + 12);
                ctx.lineTo(x + 5, y + flap);
                ctx.lineTo(x + 13, y + 17);
                ctx.closePath();
                ctx.fill();
                ctx.fillStyle = palette.gold;
                ctx.beginPath();
                ctx.moveTo(x + 37, y + 12);
                ctx.lineTo(x + 46, y + 16);
                ctx.lineTo(x + 36, y + 18);
                ctx.fill();
                ctx.fillStyle = palette.ink;
                ctx.beginPath();
                ctx.arc(x + 32, y + 9, 1.7, 0, Math.PI * 2);
                ctx.fill();
            }

            function draw() {
                if (!width || !height) return;
                ctx.clearRect(0, 0, width, height);
                drawBackdrop();
                obstacles.forEach((obstacle) => obstacle.type === 'bird' ? drawBird(obstacle) : drawCactus(obstacle));
                drawDino();
                particles.forEach((particle) => {
                    ctx.globalAlpha = Math.max(0, particle.life / .45);
                    ctx.fillStyle = particle.color;
                    ctx.fillRect(particle.x, particle.y, particle.size, particle.size);
                });
                ctx.globalAlpha = 1;
            }

            function startGame() {
                cancelAnimationFrame(animationId);
                state = 'running';
                lastTime = 0;
                elapsed = 0;
                score = 0;
                speed = 330;
                spawnTimer = .9;
                obstacles = [];
                particles = [];
                player.vy = 0;
                player.onGround = true;
                player.y = groundY - player.height;
                jumpHeld = false;
                duckHeld = false;
                scoreLabel.textContent = formatScore(0);
                statusLabel.textContent = 'LARI TERUS!';
                overlay.hidden = true;
                animationId = requestAnimationFrame(loop);
            }

            function jump() {
                if (state !== 'running' || !player.onGround || duckHeld) return;
                player.vy = -690;
                player.onGround = false;
                for (let i = 0; i < 7; i++) {
                    particles.push({ x: player.x + 12 + Math.random() * 25, y: groundY + Math.random() * 4, vx: -35 - Math.random() * 55, vy: -25 - Math.random() * 80, life: .45, size: 2 + Math.random() * 3, color: i % 2 ? palette.gold : '#c9c2e8' });
                }
            }

            function spawnObstacle() {
                if (score > 180 && Math.random() > .68) {
                    const heights = [groundY - 83, groundY - 121];
                    obstacles.push({ type: 'bird', x: width + 30, y: heights[Math.floor(Math.random() * heights.length)], width: 46, height: 28 });
                } else {
                    const size = Math.random() > .72 ? 1.35 : 1;
                    obstacles.push({ type: 'cactus', x: width + 25, width: 35 * size, height: (36 + Math.random() * 24) * size });
                }
                spawnTimer = Math.max(.67, 1.25 + Math.random() * .72 - (speed - 330) / 1000);
            }

            function checkCollision() {
                const ducking = duckHeld && player.onGround;
                const playerHeight = ducking ? player.duckHeight : player.height;
                const playerY = player.y + (player.height - playerHeight);
                const box = { x: player.x + 8, y: playerY + 7, w: player.width - 15, h: playerHeight - 10 };
                return obstacles.some((obstacle) => {
                    const hitBox = obstacle.type === 'bird'
                        ? { x: obstacle.x + 7, y: obstacle.y + 5, w: obstacle.width - 13, h: obstacle.height - 8 }
                        : { x: obstacle.x + 4, y: groundY - obstacle.height + 5, w: obstacle.width - 8, h: obstacle.height - 7 };
                    return box.x < hitBox.x + hitBox.w && box.x + box.w > hitBox.x && box.y < hitBox.y + hitBox.h && box.y + box.h > hitBox.y;
                });
            }

            function endGame() {
                state = 'over';
                statusLabel.textContent = 'LARI SELESAI';
                const finalScore = Math.floor(score);
                if (finalScore > best) {
                    best = finalScore;
                    localStorage.setItem('dinoDashBest', String(best));
                    bestLabel.textContent = formatScore(best);
                }
                dialogMark.textContent = '💥';
                dialogTitle.textContent = 'Game Over';
                dialogText.textContent = `Kamu berhasil mengumpulkan ${formatScore(finalScore)} poin. Coba pecahkan rekor terbaikmu!`;
                startButton.textContent = 'Coba Lagi';
                overlay.hidden = false;
            }

            function update(dt) {
                elapsed += dt;
                speed = Math.min(760, speed + dt * 8);
                score += dt * speed * .06;
                scoreLabel.textContent = formatScore(score);
                player.runTime += dt;
                if (!player.onGround) {
                    player.vy += 1900 * dt;
                    player.y += player.vy * dt;
                    if (player.y >= groundY - player.height) {
                        player.y = groundY - player.height;
                        player.vy = 0;
                        player.onGround = true;
                    }
                }
                spawnTimer -= dt;
                if (spawnTimer <= 0) spawnObstacle();
                obstacles.forEach((obstacle) => { obstacle.x -= speed * dt; });
                obstacles = obstacles.filter((obstacle) => obstacle.x + obstacle.width > -10);
                particles.forEach((particle) => {
                    particle.x += particle.vx * dt;
                    particle.y += particle.vy * dt;
                    particle.vy += 260 * dt;
                    particle.life -= dt;
                });
                particles = particles.filter((particle) => particle.life > 0);
                if (checkCollision()) endGame();
            }

            function loop(timestamp) {
                if (state !== 'running') return;
                const dt = Math.min((timestamp - (lastTime || timestamp)) / 1000, .035);
                lastTime = timestamp;
                update(dt);
                draw();
                if (state === 'running') animationId = requestAnimationFrame(loop);
            }

            document.addEventListener('keydown', (event) => {
                if (['Space', 'ArrowUp', 'ArrowDown'].includes(event.code)) event.preventDefault();
                if (['Space', 'ArrowUp', 'KeyW'].includes(event.code) && !jumpHeld) {
                    jumpHeld = true;
                    if (state === 'ready') startGame();
                    else jump();
                }
                if (event.code === 'ArrowDown' || event.code === 'KeyS') duckHeld = true;
            });
            document.addEventListener('keyup', (event) => {
                if (['Space', 'ArrowUp', 'KeyW'].includes(event.code)) jumpHeld = false;
                if (event.code === 'ArrowDown' || event.code === 'KeyS') duckHeld = false;
            });
            startButton.addEventListener('click', startGame);
            stage.addEventListener('pointerdown', (event) => {
                if (event.target.closest('.overlay')) return;
                if (state === 'ready') startGame();
                else jump();
            });
            document.getElementById('jumpButton').addEventListener('pointerdown', (event) => { event.preventDefault(); jump(); });
            const duckButton = document.getElementById('duckButton');
            duckButton.addEventListener('pointerdown', (event) => { event.preventDefault(); duckHeld = true; });
            ['pointerup', 'pointercancel', 'pointerleave'].forEach((name) => duckButton.addEventListener(name, () => { duckHeld = false; }));
            window.addEventListener('blur', () => { jumpHeld = false; duckHeld = false; });
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();
        })();
    </script>
</body>

</html>
